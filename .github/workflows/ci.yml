name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # No Supabase secrets are provided on purpose: tests mock the client.
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: http://supabase.test
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
